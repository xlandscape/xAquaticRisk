# =============================================================================
# xAquaticRisk Simulation Parameters
# =============================================================================
# This YAML file is equivalent to template.xrun and can be used as an
# alternative parameterisation format. Start a simulation by passing this file
# to __start__.bat instead of an .xrun file.
# =============================================================================

SimulationInfo:
  # A unique identifier of a simulation run
  # Values: Any characters that are valid in file system identifiers
  # Remark: Running a simulation with the same name as an existing run results in an error.
  SimID: Test_Run_aqRisk

  # A file pattern of potential parents for this run
  # Values: Empty or a file pattern yielding at least one X3df data store file.
  # Remark: The feature is currently experimental.
  ParentRun:

  # The number of Monte Carlo runs that are conducted simultaneously
  # Values: Any positive integer
  # Best practice: min(NumberMC, NumberParallelProcesses) <= available processors
  NumberParallelProcesses: 2

  # The number of processes spawned by CascadeToxswa
  # Values: Any positive integer
  # Remark: Only in effect if RunCascadeToxswa is true.
  CascadeToxswaWorkers: 12

  # Specifies whether processing folders should be deleted after the model run is finished
  # Values: true or false
  DeleteFoldersAtFinish: false

  # Specifies whether verbose logging is used
  # Values: true or false
  VerboseLogging: false

  # Specifies whether the performance of the simulation run is profiled
  # Values: true or false
  EnableProfiling: false

  # The time interval in seconds between two profiling rounds
  # Values: Any positive integer
  ProfilingWaitingTime: 5

Scenario:
  # The scenario used by the simulation
  # Values: scenario/<xyz> where <xyz> is one of the sub-folders in the scenario folder.
  # Remark: Make sure that the scenario is present in the scenario sub-folder.
  Project: scenario/oudebeek-beek7-tdi

  # The first date that is simulated
  # Values: A date of format YYYY-MM-DD within the valid range of dates
  # Remark: The valid range of start dates is mainly determined by the input data for the selected scenario.
  SimulationStart: "2015-05-01"

  # The last date that is simulated
  # Values: A date of format YYYY-MM-DD within the valid range of dates
  # Remark: Must be later than the simulation start (or the same date).
  SimulationEnd: "2015-05-07"

PppUse:
  # The application rate in g/ha
  # Values: Any positive number (or zero)
  # Remark: The application rate applies to all applications within application sequences.
  ApplicationRate: 12.5

  # The time windows within which applications take place
  # Values: format: MM-DD to MM-DD[, MM-DD to MM-DD[, ...]]
  # Remark: For each target field, year and application within an application sequence, a random
  #         date within the specified time window is selected.
  # Examples:
  #   04-15 to 04-15           : All fields are applied on 15th of April every year
  #   04-07 to 04-21           : Random date between 7th and 21st of April
  #   04-07 to 04-21, 05-02 to 05-16 : Two applications per year with random dates
  ApplicationTimeWindow: "05-02 to 05-02"

Mitigation:
  # A in-crop buffer not applied in meters
  # Values: Zero or a positive number.
  # Remark: The in-crop buffer is geometrically applied to the field and might result in very
  #         small fields not being applied at all.
  InCropBuffer: 0

  # The effect of drift-reducing nozzles to spray-drift deposition; the fraction filtered out
  # Values: A number between 0 and 1
  # Remark: Zero means no effect = full spray-drift deposition, 1 means full filtering
  TechnologyDriftReduction: 0

Exposure:
  # The Rautmann drift class used in the simulation
  # Values: orchards.early, orchards.late or arable
  # Remark: The Rautmann class is applied to all applications of application sequences.
  # Best practice: Select the Rautmann class fitting to the crop type and application dates.
  RautmannClass: orchards.early

  # File path to a CSV file containing predefined spray-drift depositions per reach and day in g/ha
  # Values: A valid file path or leave empty
  # Remark: Setting this parameter to a file path will use depositions as specified in the file.
  #         The SprayDrift component is not run in this case. Use a path relative to this file,
  #         e.g., samples/predefined_depositions.csv
  DepositionInputFile:

EnvironmentalFate:
  # Controls whether environmental fate is calculated by StepsRiverNetwork
  # Values: true or false
  RunStepsRiverNetwork: true

  # Controls whether environmental fate is calculated by CascadeToxswa
  # Values: true or false
  RunCascadeToxswa: true

  # The surface water value precision used by StepsRiverNetwork
  # Values: A positive number
  # Remark: Only applies if RunStepsRiverNetwork is true.
  ThresholdSW: 0.001

  # The sediment value precision used by StepsRiverNetwork
  # Values: A positive number
  # Remark: Only applies if RunStepsRiverNetwork is true.
  ThresholdSediment: 0.1

  # The molar mass of the applied substance (g/mol)
  MolarMass: 505.2

  # The saturated vapour pressure of the applied substance at 20 deg C (Pa)
  SaturatedVapourPressure: "1.10E-06"

  # The molar enthalpy of vaporization of the applied substance (kJ/mol)
  MolarEnthalpyOfVaporization: 95

  # The solubility in water of the applied substance at 20 deg C (mg/l)
  SolubilityInWater: 0.001

  # The molar enthalpy of dissolution of the applied substance (kJ/mol)
  MolarEnthalpyOfDissolution: 27

  # The diffusion coefficient of the applied substance at 20 deg C (m2/d)
  DiffusionCoefficient: "4.30E-05"

  # The half-life transformation time in water of the applied substance at 20 deg C (d)
  DT50sw: 1000

  # The molar activation enthalpy for transformation in water (kJ/mol)
  MolarActivationEnthalpyOfTransformationInWater: 65.4

  # The half-life transformation time in sediment of the applied substance at 20 deg C (d)
  DT50sed: 43.9

  # The molar activation enthalpy for transformation in sediment (kJ/mol)
  MolarActivationEnthalpyOfTransformationInSediment: 65.4

  # The organic carbon-water partition coefficient of the applied substance (l/kg)
  # Remark: KOM is derived from KOC by dividing by 1.742
  KOC: 460000

  # The reference concentration for the KOC (mg/l)
  ReferenceConcentrationForKOC: 1

  # The Freundlich exponent in sediment and suspended particles (unitless)
  FreundlichExponentInSedimentAndSuspendedParticles: 0.93

  # The coefficient for linear adsorption on macrophytes (l/kg)
  CoefficientForLinearAdsorptionOnMacrophytes: 0

Effects:
  # Specifies whether effects are simulated by LGuts
  # Values: true or false
  RunLGuts: true

  # The reaches for which LGuts and LPop runs are conducted
  # Values: A space separated list of reach identifiers
  # Remark: An empty list results in a simulation for all reaches.
  ReachSelection: "567 570 580 584"

  # Number of years to run LPop in order to get stable population cycles
  # Values: Integer value
  NumberOfWarmUpYears: 1

  # Number of years to run LPop after last year of application to allow for recovery
  # Values: Integer value
  RecoveryPeriodYears: 1

  # --- Species 1 ---
  Species1: Asellus aquaticus
  Species1DominantRateConstantSD: 0.01188
  Species1ThresholdConcentrationSD: 0.05507
  Species1KillingRateSD: 0.002615
  Species1DominantRateConstantIT: 0.0005541
  Species1ThresholdDistributionIT: 0.4429
  Species1WidthOfThresholdDistributionIT: 1.582

  # --- Species 2 ---
  Species2: Cloeon dipterum
  Species2DominantRateConstantSD: 0.03719
  Species2ThresholdConcentrationSD: 4.702
  Species2KillingRateSD: 0.0009361
  Species2DominantRateConstantIT: 0.01416
  Species2ThresholdDistributionIT: 36.27
  Species2WidthOfThresholdDistributionIT: 1.648

  # --- Species 3 ---
  Species3: Gammarus pulex
  Species3DominantRateConstantSD: 0.008858
  Species3ThresholdConcentrationSD: 0.6292
  Species3KillingRateSD: 0.01989
  Species3DominantRateConstantIT: 0.002324
  Species3ThresholdDistributionIT: 0.8206
  Species3WidthOfThresholdDistributionIT: 3.049

Settings:
  # The number of Monte Carlo runs
  # Values: Any positive integer
  # Best practice: Always conduct multiple MC runs (except for technical tests).
  NumberMC: 1

  # Specifies whether PECs and individual effects are exported into a SQLite database
  # Values: true or false
  ExportToSqlite: true

Analysis:
  # Pre-selection of reaches for which detailed reports are generated
  # Values: Comma-separated reach identifiers in the format rXYZ (no spaces)
  ReportingReaches: r577

  # The PEC value that is plotted for each enabled environmental fate component
  # Values: A date and time of format YYYY-MM-DD HH:MM
  PecDisplayedTime: "2015-05-02 12:00"

