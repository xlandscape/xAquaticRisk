# =============================================================================
# xAquaticRisk Simulation Parameters
# =============================================================================
# Converted from .xrun by convert_xrun.py
# =============================================================================

# --- Control ---
Control:
  # A unique identifier of a simulation run
  ExperimentID: "muenster_1mar_test1"
  # A file pattern of potential parents for this run (leave empty to disable)
  ParentRun:
  # The number of Monte Carlo runs that are conducted simultaneously
  NumberParallelProcesses: 6
  # The number of processes spawned by CascadeToxswa
  CascadeToxswaWorkers: 2
  # Delete processing folders after the model run is finished (true/false)
  DeleteComponentProcessingFolders: true
  # Enable verbose logging (true/false)
  VerboseLogging: false
  # Enable performance profiling (true/false)
  EnableProfiling: false
  # Time interval in seconds between profiling rounds
  ProfilingWaitingTime: 5

# --- Scenario ---
Scenario:
  # The scenario used by the simulation (scenario/<sub-folder>)
  LandscapeScenario: scenario/muenster-T-Di-02.5-20220429-postproceccing-toxwa
  # The first date that is simulated (YYYY-MM-DD)
  SimulationStart: "1991-04-01"
  # The last date that is simulated (YYYY-MM-DD)
  SimulationEnd: "1991-04-10"

# --- PPP Use ---
PppUse:
  # The application rate in g/ha
  ApplicationRate: 7.5
  # Time windows: MM-DD to MM-DD[, MM-DD to MM-DD[, ...]]
  ApplicationTimeWindow: "04-01 to 04-10"

# --- Mitigation ---
Mitigation:
  # In-crop buffer not applied in meters
  InCropBuffer: 0
  # Drift-reducing nozzle effect (0 = none, 1 = full filtering)
  TechnologyDriftReduction: 0

# --- Exposure ---
Exposure:
  # Rautmann drift class: orchards.early, orchards.late or arable
  RautmannClass: orchards.early
  # CSV file with predefined spray-drift depositions (leave empty to disable)
  DepositionInputFile:

# --- Environmental Fate ---
EnvironmentalFate:
  # Run StepsRiverNetwork environmental fate (true/false)
  RunStepsRiverNetwork: false
  # Run CascadeToxswa environmental fate (true/false)
  RunCascadeToxswa: true
  # Surface water value precision (StepsRiverNetwork)
  ThresholdSW: 0.001
  # Sediment value precision (StepsRiverNetwork)
  ThresholdSediment: 0.1
  # Molar mass of the applied substance (g/mol)
  MolarMass: 505.2
  # Saturated vapour pressure at 20 deg C (Pa)
  SaturatedVapourPressure: "1.10E-06"
  # Molar enthalpy of vaporization (kJ/mol)
  MolarEnthalpyOfVaporization: 95
  # Solubility in water at 20 deg C (mg/l)
  SolubilityInWater: 0.001
  # Molar enthalpy of dissolution (kJ/mol)
  MolarEnthalpyOfDissolution: 27
  # Diffusion coefficient at 20 deg C (m2/d)
  DiffusionCoefficient: "4.30E-05"
  # Half-life transformation time in water at 20 deg C (d)
  DT50sw: "1000"
  # Molar activation enthalpy for transformation in water (kJ/mol)
  MolarActivationEnthalpyOfTransformationInWater: 65.4
  # Half-life transformation time in sediment at 20 deg C (d)
  DT50sed: 43.9
  # Molar activation enthalpy for transformation in sediment (kJ/mol)
  MolarActivationEnthalpyOfTransformationInSediment: 65.4
  # Organic carbon-water partition coefficient (l/kg)
  KOC: "460000"
  # Reference concentration for KOC (mg/l)
  ReferenceConcentrationForKOC: 1
  # Freundlich exponent in sediment and suspended particles
  FreundlichExponentInSedimentAndSuspendedParticles: 0.93
  # Coefficient for linear adsorption on macrophytes (l/kg)
  CoefficientForLinearAdsorptionOnMacrophytes: 0

# --- Effects ---
Effects:
  # Simulate effects with LGuts (true/false)
  RunLGuts: true
  # Number of LPop warm-up years for stable population cycles
  NumberOfWarmUpYears: 1
  # Number of years after last application to allow recovery
  RecoveryPeriodYears: 1

  # --- Species 1 ---
  Species1: Asellus aquaticus
  Species1DominantRateConstantSD: 0.01188
  Species1ThresholdConcentrationSD: 0.05507
  Species1KillingRateSD: 0.002615
  Species1DominantRateConstantIT: 0.0005541
  Species1ThresholdDistributionIT: 0.4429
  Species1WidthOfThresholdDistributionIT: 1.582

  # --- Species 2 ---
  Species2: Cloeon dipterum
  Species2DominantRateConstantSD: 0.03719
  Species2ThresholdConcentrationSD: 4.702
  Species2KillingRateSD: 0.0009361
  Species2DominantRateConstantIT: 0.01416
  Species2ThresholdDistributionIT: 36.27
  Species2WidthOfThresholdDistributionIT: 1.648

  # --- Species 3 ---
  Species3: Gammarus pulex
  Species3DominantRateConstantSD: 0.008858
  Species3ThresholdConcentrationSD: 0.6292
  Species3KillingRateSD: 0.01989
  Species3DominantRateConstantIT: 0.002324
  Species3ThresholdDistributionIT: 0.8206
  Species3WidthOfThresholdDistributionIT: 3.049

# --- Settings ---
Settings:
  # Number of Monte Carlo runs
  NumberMC: 3
  # Export PECs and effects to SQLite database (true/false)
  ExportToSqlite: false

# --- Analysis ---
Analysis:
  # Reaches for detailed reports (comma-separated, e.g. r577)
  ReportingReaches: r154
  # PEC time plotted per environmental fate component (YYYY-MM-DD HH:MM)
  PecDisplayedTime: "2015-04-02 12:00"

